  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
  reactions: true
whatsapp: {}
feishu:
  channel_skill_bindings:
  - id: oc_6ed1cc645057da3bbe93c6120219a61e
    skills:
    - group-thinking
    - source-evolution
    - core-thinking
  - id: oc_796d9f6d333a76820bc7dad59706e7cc
    skills:
    - stock-analysis
    - stock-analysis-akshare
approvals:
  mode: smart
  timeout: 60
command_allowlist:
- kill hermes/gateway process (self-termination)
- script execution via heredoc
- script execution via -e/-c flag
- overwrite system file via redirection
- stop/restart system service
- kill process via pgrep expansion (self-termination)
- delete in root path
- shell command via -c/-lc flag
- recursive delete
quick_commands: {}
personalities: {}
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
cron:
  wrap_response: true
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
network:
  force_ipv4: false
mcp_servers:
  vibe-trading:
    command: python3
    args:
    - /root/stock/Vibe-Trading/agent/mcp_server.py
    env:
      LANGCHAIN_PROVIDER: openrouter
      LANGCHAIN_MODEL_NAME: deepseek/deepseek-v3.2
      OPENROUTER_API_KEY: YOUR_OPENROUTER_API_KEY_HERE
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      TUSHARE_TOKEN: YOUR_TUSHARE_TOKEN_HERE
    description: "Vibe-Trading \u667A\u80FD\u4EA4\u6613\u5206\u6790\uFF08\u6280\u672F\
      \u6307\u6807\u3001\u7B56\u7565\u56DE\u6D4B\u3001\u98CE\u63A7\uFF09"
  tradingagents:
    command: python3
    args:
    - /root/stock/TradingAgents/tradingagents/mcp_server.py
    description: "TradingAgents \u591A\u4EE3\u7406\u4EA4\u6613\u7CFB\u7EDF\uFF08\u591A\
      \u7A7A\u5206\u6790\u3001\u7EC4\u5408\u4F18\u5316\u3001\u98CE\u9669\u5BF9\u51B2\
      \uFF09"
  akshare:
    command: /root/hermes-agent/venv/bin/python
    args:
    - -m
    - akshare_mcp
    description: "A\u80A1/\u6E2F\u80A1/\u671F\u8D27/\u5B8F\u89C2/\u57FA\u91D1\u6570\
      \u636E\u67E5\u8BE2\uFF08akshare\uFF09"
_config_version: 13
gateway:
  user_roles:
    admin:
    - ou_d366ba075912a3865430a7fe7020454b
  restricted_channels:
    oc_6ed1cc645057da3bbe93c6120219a61e:
      users:
      - id: ou_d366ba075912a3865430a7fe7020454b
