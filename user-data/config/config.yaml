model:
  context_length: 200000
  default: coding
  provider: custom:local-coding
providers:
  local-coding:
    api: http://localhost:4000
    api_key: YOUR_API_KEY_HERE
    default_model: coding
    name: Local Coding
    transport: anthropic_messages
fallback_providers: []
credential_pool_strategies: {}
toolsets:
- hermes-cli
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 900
  gateway_notify_interval: 600
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 180
  env_passthrough: []
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  docker_env: {}
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  persistent_shell: true
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  camofox:
    managed_persistence: false
checkpoints:
  enabled: true
  max_snapshots: 50
file_read_max_chars: 100000
compression:
  enabled: true
  threshold: 0.75
  target_ratio: 0.2
  protect_last_n: 20
  summary_base_url: null
  summary_model: ''
  summary_provider: auto
smart_model_routing:
  enabled: false
  max_simple_chars: 160
  max_simple_words: 28
  cheap_model: {}
auxiliary:
  vision:
    provider: auto
    model: ''
    base_url: ''
    api_key: YOUR_API_KEY_HERE
    timeout: 30
    download_timeout: 30
  web_extract:
    provider: auto
    model: ''
    base_url: ''
    api_key: YOUR_API_KEY_HERE
    timeout: 360
  compression:
    provider: auto
    model: ''
    base_url: ''
    api_key: YOUR_API_KEY_HERE
    timeout: 120
    context_length: 200000
  session_search:
    provider: auto
    model: ''
    base_url: ''
    api_key: YOUR_API_KEY_HERE
    timeout: 30
  skills_hub:
    provider: auto
    model: ''
    base_url: ''
    api_key: YOUR_API_KEY_HERE
    timeout: 30
  approval:
    provider: auto
    model: ''
    base_url: ''
    api_key: YOUR_API_KEY_HERE
